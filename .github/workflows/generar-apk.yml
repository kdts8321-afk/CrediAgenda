name: Personal 2.9 - Independiente, Liverpool, Departamental y pagos correctos

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Reconstruir base del proyecto
        shell: bash
        run: |
          cat source-1.b64 source-2.b64 source-3.b64 source-4.b64 | base64 --decode > source.tar.xz
          echo '8d173e9371206ea51d8538176e29a38d934a6954a563019f3b8d53629ad16ac8  source.tar.xz' | sha256sum --check
          tar -xJf source.tar.xz
          test -f app/src/main/AndroidManifest.xml
      - name: Instalar herramientas para logos
        run: python -m pip install --disable-pip-version-check --quiet cairosvg Pillow
      - name: Actualizar interfaz y preparar logos
        shell: bash
        run: |
          python patches/upgrade_cards.py
          python patches/upgrade_privacy_21.py
          python patches/upgrade_access_22.py
          python patches/upgrade_cutoffs_23.py
          python patches/upgrade_nicknames_calendar_25.py
          python patches/upgrade_biometric_haptics_26.py
          python patches/upgrade_cutoffs_session_27.py
          python patches/upgrade_settings_red_28.py
          python patches/upgrade_pending_balance_29.py
          python patches/upgrade_liverpool_departamental_29.py
          python patches/create_logos.py
          python patches/personal_name_icon_24.py
          sed -i "s/applicationId 'mx.crediagenda.app'/applicationId 'mx.crediagenda.app.personal29'/" app/build.gradle
          sed -i "s/versionCode 1/versionCode 11/" app/build.gradle
          sed -i "s/versionName '1.0'/versionName '2.9'/" app/build.gradle
          grep 'android:label="Personal"' app/src/main/AndroidManifest.xml
          sed -i 's/android:label="Personal"/android:label="Personal 2.9"/' app/src/main/AndroidManifest.xml
          grep 'android:label="Personal 2.9"' app/src/main/AndroidManifest.xml
          grep "applicationId 'mx.crediagenda.app.personal29'" app/build.gradle
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK Android
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK de release
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug assembleRelease 2>&1 | tee build.log
      - name: Probar cálculo real de saldo con Java
        shell: bash
        run: |
          mkdir -p /tmp/personal29
          javac -encoding UTF-8 -d /tmp/personal29 app/src/main/java/mx/crediagenda/app/Models.java app/src/main/java/mx/crediagenda/app/PaymentRules.java patches/VerifyBalance29.java
          java -cp /tmp/personal29 mx.crediagenda.app.VerifyBalance29
      - name: Firmar APK 2.9
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          pass="$(openssl rand -hex 24)"
          keytool -genkeypair -keystore "$tmp/key.jks" -alias personal -storepass "$pass" -keypass "$pass" -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Personal 2.9, O=Personal, C=MX"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$tmp/align.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$tmp/key.jks" --ks-key-alias personal --ks-pass "pass:$pass" --key-pass "pass:$pass" --v2-signing-enabled true --v3-signing-enabled true --out Personal-2.9.apk "$tmp/align.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Personal-2.9.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Personal-2.9.apk | grep "package: name='mx.crediagenda.app.personal29' versionCode='11' versionName='2.9'"
          echo "Personal 2.9 es una instalación nueva e independiente. La 2.8 no se modifica."
      - name: Habilitar KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar instalacion y apertura en Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path mx.crediagenda.app.personal29
            adb shell am start -W -n mx.crediagenda.app.personal29/mx.crediagenda.app.MainActivity
            sleep 4
            adb shell pidof mx.crediagenda.app.personal29
            CREDIAGENDA_TEST_PACKAGE=mx.crediagenda.app.personal29 CREDIAGENDA_APP_LABEL=Personal python patches/check_access_22.py
            python patches/check_nicknames_calendar_25.py
            python patches/check_cutoffs_23.py
            python patches/check_biometric_haptics_26.py
            python patches/check_cutoffs_session_27.py
            python patches/check_settings_red_28.py
            python patches/check_balance_29.py

      - name: Publicar APK Personal 2.9
        uses: actions/upload-artifact@v4
        with:
          name: Personal-2.9-APK
          path: Personal-2.9.apk
          if-no-files-found: error
          retention-days: 30
